<!DOCTYPE html>
<html lang="kaa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gulim ushın sırlı xat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #0b0509;
      --bg-mid: #160912;
      --rose-light: #ffb7d0;
      --rose-main: #ff84ae;
      --rose-deep: #d95282;
      --paper: #f7f2eb;
      --paper-dark: #ebe2d7;
      --ink: #2b2126;
      --text-main: #f6edf2;
      --text-muted: rgba(246, 237, 242, 0.64);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 45%, #1d0c17 0%, #0d050a 58%, #070306 100%);
      color: var(--text-main);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    .ambient-glow {
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 50% 48%, rgba(255, 118, 165, 0.11) 0%, rgba(255, 118, 165, 0) 48%),
        radial-gradient(circle at 20% 80%, rgba(168, 65, 118, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 85% 20%, rgba(255, 150, 190, 0.07) 0%, transparent 40%);
    }

    .stage {
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.65s ease, visibility 0.65s ease;
    }

    .stage.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .rose-btn {
      width: 100%;
      max-width: 300px;
      padding: 14px 26px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffaec9 0%, #f782aa 100%);
      color: #210913;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      box-shadow:
        0 6px 26px rgba(255, 128, 174, 0.34),
        inset 0 1px 1px rgba(255, 255, 255, 0.55);
      transition: transform 0.2s ease, box-shadow 0.25s ease, filter 0.2s ease;
    }

    .rose-btn:hover {
      transform: translateY(-1px) scale(1.015);
      box-shadow:
        0 8px 34px rgba(255, 128, 174, 0.48),
        inset 0 1px 1px rgba(255, 255, 255, 0.65);
    }

    .rose-btn:active {
      transform: scale(0.985);
    }

    .rose-btn.small-pill {
      width: auto;
      min-width: 148px;
      padding: 12px 30px;
    }

    /* ==================== STAGE 1: SECRET WORD ==================== */
    .lock-card {
      width: 100%;
      max-width: 360px;
      margin: auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .lock-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(26px, 6vw, 34px);
      font-weight: 500;
      line-height: 1.2;
      color: #fdf5f8;
      margin-bottom: 12px;
      letter-spacing: 0.01em;
    }

    .lock-hint {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 18px;
      color: var(--text-muted);
      margin-bottom: 30px;
    }

    .lock-input {
      width: 100%;
      max-width: 300px;
      padding: 14px 20px;
      border-radius: 999px;
      border: 1px solid rgba(255, 194, 216, 0.16);
      background: rgba(255, 255, 255, 0.055);
      color: #fff;
      font-size: 15px;
      text-align: center;
      outline: none;
      margin-bottom: 14px;
      transition: border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    }

    .lock-input::placeholder {
      color: rgba(255, 240, 246, 0.36);
    }

    .lock-input:focus {
      border-color: rgba(255, 152, 190, 0.55);
      background: rgba(255, 255, 255, 0.085);
      box-shadow: 0 0 22px rgba(255, 130, 174, 0.18);
    }

    .lock-error {
      min-height: 20px;
      margin-top: 10px;
      font-size: 13px;
      color: #ff9cb9;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .lock-error.show {
      opacity: 1;
    }

    @keyframes shakeX {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }

    .shake {
      animation: shakeX 0.38s ease;
    }

    /* ==================== STAGE 2: INTRO + ENVELOPE ==================== */
    .intro-text-wrap {
      position: absolute;
      text-align: center;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.7s ease, transform 0.7s ease;
      pointer-events: none;
    }

    .intro-text-wrap.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .intro-name {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 26px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .intro-sub {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(30px, 7vw, 40px);
      font-weight: 500;
      color: #fff5f8;
    }

    .envelope-scene {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto;
      opacity: 0;
      transform: translateY(18px) scale(0.95);
      transition: opacity 0.75s ease, transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    .envelope-scene.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .envelope-wrap {
      position: relative;
      width: min(84vw, 310px);
      height: calc(min(84vw, 310px) * 0.65);
      cursor: pointer;
      perspective: 1100px;
      filter: drop-shadow(0 24px 48px rgba(0, 0, 0, 0.55));
    }

    .envelope-halo {
      position: absolute;
      top: -34px; right: -34px; bottom: -34px; left: -34px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 118, 165, 0.28) 0%, rgba(255, 118, 165, 0) 68%);
      z-index: 0;
      pointer-events: none;
    }

    .envelope-body {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 12px;
      background: linear-gradient(155deg, #f3ede5 0%, #e5dbd0 100%);
      overflow: visible;
      z-index: 1;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.65);
    }

    .envelope-letter-peek {
      position: absolute;
      left: 6%;
      right: 6%;
      bottom: 8%;
      height: 82%;
      border-radius: 8px;
      background: linear-gradient(180deg, #faf6f0 0%, #f0e7dc 100%);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.14);
      z-index: 2;
      transition: transform 0.85s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .envelope-wrap.opening .envelope-letter-peek {
      transform: translateY(-78%);
    }

    .envelope-front-folds {
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%;
      border-radius: 12px;
      overflow: hidden;
      z-index: 3;
      pointer-events: none;
    }

    .envelope-front-folds::before {
      content: '';
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%;
      background:
        linear-gradient(29deg, #e7ded3 49.6%, transparent 50.4%),
        linear-gradient(151deg, #e7ded3 49.6%, transparent 50.4%);
    }

    .envelope-front-folds::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 58%;
      background: linear-gradient(180deg, #efe8de 0%, #e3d9cd 100%);
      clip-path: polygon(0 100%, 50% 8%, 100% 100%);
      filter: drop-shadow(0 -2px 3px rgba(60, 40, 45, 0.08));
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 56%;
      z-index: 5;
      transform-origin: top center;
      transition: transform 0.72s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }

    .envelope-flap-inner {
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #f6f0e8 0%, #e9dfd3 100%);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
      filter: drop-shadow(0 4px 7px rgba(45, 22, 32, 0.14));
    }

    .envelope-wrap.opening .envelope-flap {
      transform: rotateX(176deg);
      z-index: 1;
    }

    .wax-seal {
      position: absolute;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      z-index: 7;
      background: radial-gradient(circle at 35% 30%, #d45878 0%, #a82d4d 62%, #7e1c37 100%);
      box-shadow:
        0 5px 14px rgba(80, 14, 34, 0.45),
        inset 0 2px 4px rgba(255, 190, 210, 0.45),
        inset 0 -3px 6px rgba(60, 8, 22, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.45s ease, opacity 0.45s ease;
    }

    .wax-seal::before {
      content: '';
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 198, 215, 0.28);
      position: absolute;
    }

    .wax-seal svg {
      width: 20px;
      height: 20px;
      fill: rgba(255, 220, 232, 0.8);
    }

    .envelope-wrap.opening .wax-seal {
      transform: translate(-50%, -50%) scale(1.28) rotate(-14deg);
      opacity: 0;
    }

    .envelope-recipient {
      position: absolute;
      bottom: 14%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      font-family: 'Caveat', cursive;
      font-size: 28px;
      font-weight: 600;
      color: #36272e;
      white-space: nowrap;
      border-bottom: 1px solid rgba(54, 39, 46, 0.22);
      padding: 0 12px 1px;
      opacity: 0;
      transition: opacity 0.8s ease 0.25s;
    }

    .envelope-scene.visible .envelope-recipient {
      opacity: 1;
    }

    .envelope-stamp {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 6;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px dashed rgba(90, 68, 76, 0.34);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 6.5px;
      letter-spacing: 0.06em;
      color: rgba(90, 68, 76, 0.48);
      transform: rotate(-14deg);
      pointer-events: none;
    }

    .envelope-prompt {
      margin-top: 26px;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 19px;
      color: var(--text-muted);
      letter-spacing: 0.02em;
      transition: opacity 0.3s ease;
    }

    /* ==================== STAGE 3: LETTER VIEW ==================== */
    .letter-stage-wrap {
      width: 100%;
      max-width: 390px;
      max-height: calc(100vh - 70px);
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .letter-paper {
      position: relative;
      width: 100%;
      max-height: calc(100vh - 155px);
      overflow-y: auto;
      background: linear-gradient(180deg, #faf5ee 0%, #f3ece2 49.5%, #e8dfd3 50%, #f4ede3 50.8%, #f8f3ec 100%);
      border-radius: 16px;
      padding: 28px 26px 26px;
      color: var(--ink);
      box-shadow:
        0 26px 65px rgba(0, 0, 0, 0.58),
        0 0 42px rgba(255, 140, 180, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
      transform: translateY(22px) scale(0.96);
      transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .stage.active .letter-paper {
      transform: translateY(0) scale(1);
    }

    .letter-paper::-webkit-scrollbar {
      width: 4px;
    }
    .letter-paper::-webkit-scrollbar-thumb {
      background: rgba(160, 120, 134, 0.3);
      border-radius: 999px;
    }

    .letter-to {
      font-family: 'Caveat', cursive;
      font-size: 20px;
      color: #d65c86;
      margin-bottom: 8px;
    }

    .letter-heading {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(26px, 6vw, 32px);
      font-weight: 500;
      color: #24191e;
      margin-bottom: 18px;
      line-height: 1.15;
    }

    .letter-body {
      font-family: 'Caveat', cursive;
      font-size: clamp(21px, 4.8vw, 24px);
      line-height: 1.42;
      color: #32262c;
      white-space: pre-line;
    }

    .letter-signature {
      margin-top: 22px;
      text-align: right;
      font-family: 'Caveat', cursive;
      font-size: 25px;
      font-weight: 600;
      color: #5e4450;
    }

    /* ==================== STAGE 4 & 5: GALAXY + PORTRAIT CANVAS ==================== */
    #cosmosStage {
      padding: 0;
    }

    #cosmosCanvas {
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%;
      display: block;
      cursor: grab;
      touch-action: none;
    }

    #cosmosCanvas:active {
      cursor: grabbing;
    }

    .cosmos-overlay-bottom {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 24px;
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      pointer-events: none;
    }

    .cosmos-overlay-bottom > * {
      pointer-events: auto;
    }

    .galaxy-hint {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: rgba(255, 232, 242, 0.62);
      letter-spacing: 0.02em;
      transition: opacity 0.45s ease;
    }

    .portrait-caption-wrap {
      text-align: center;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.9s ease, transform 0.9s ease;
      pointer-events: none;
      margin-bottom: 4px;
      max-width: 92vw;
    }

    .portrait-caption-wrap.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .portrait-name {
      font-family: 'Caveat', cursive;
      font-size: clamp(40px, 9.5vw, 54px);
      font-weight: 600;
      color: #fff6fa;
      text-shadow: 0 0 26px rgba(255, 132, 174, 0.62);
      line-height: 1.05;
    }

    .portrait-love {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: clamp(19px, 4.8vw, 24px);
      color: rgba(255, 222, 235, 0.92);
      margin-top: 6px;
      line-height: 1.25;
      letter-spacing: 0.02em;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.65);
    }

    .hidden {
      display: none !important;
    }

    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      z-index: 120;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(30, 14, 24, 0.94);
      border: 1px solid rgba(255, 152, 190, 0.42);
      color: #fff3f8;
      font-size: 13px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      max-width: 90vw;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <!-- Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- STAGE 1: SECRET WORD -->
  <section id="stage1" class="stage active">
    <div class="lock-card">
      <h1 class="lock-title">Bul sezim bir sóz benen jabılǵan</h1>
      <p class="lock-hint">inglis tilinde «muhabbat»</p>
      <input type="text" id="secretInput" class="lock-input" placeholder="sóz" autocomplete="off" spellcheck="false" />
      <button type="button" id="unlockBtn" class="rose-btn">Ashıw</button>
      <div id="lockError" class="lock-error"></div>
    </div>
  </section>

  <!-- STAGE 2: ENVELOPE -->
  <section id="stage2" class="stage">
    <div id="introTextWrap" class="intro-text-wrap">
      <div class="intro-name">Gulim,</div>
      <div class="intro-sub">saǵan xat bar</div>
    </div>

    <div id="envelopeScene" class="envelope-scene">
      <div id="envelopeWrap" class="envelope-wrap" role="button" tabindex="0" aria-label="Xattı ashıw">
        <div class="envelope-halo"></div>
        <div class="envelope-body">
          <div class="envelope-letter-peek"></div>
          <div class="envelope-front-folds"></div>
          <div class="envelope-flap">
            <div class="envelope-flap-inner"></div>
          </div>
          <div class="wax-seal" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          </div>
          <div class="envelope-recipient">Gulim</div>
          <div class="envelope-stamp">QÁLBIM<br/>XATI</div>
        </div>
      </div>
      <div id="envelopePrompt" class="envelope-prompt">bunı ash</div>
    </div>
  </section>

  <!-- STAGE 3: LETTER -->
  <section id="stage3" class="stage">
    <div class="letter-stage-wrap">
      <article class="letter-paper">
        <div class="letter-to">bul saǵan, Gulim</div>
        <h2 class="letter-heading">Men oylap kórdim</h2>
        <div id="letterBody" class="letter-body"></div>
        <div class="letter-signature">Seniń janıń</div>
      </article>
      <button type="button" id="toGalaxyBtn" class="rose-btn">bas, juwabı usı jerde 🤍</button>
    </div>
  </section>

  <!-- STAGE 4 & 5: 3D GALAXY & CRISP TEXT-MOSAIC PORTRAIT -->
  <section id="cosmosStage" class="stage">
    <canvas id="cosmosCanvas"></canvas>

    <div class="cosmos-overlay-bottom">
      <div id="portraitCaptionWrap" class="portrait-caption-wrap">
        <div class="portrait-name">Gulim</div>
        <div class="portrait-love">Men seni shın júregim menen jaqsı kóremen</div>
      </div>

      <div id="galaxyHint" class="galaxy-hint">galaktikanı aylandır</div>

      <button type="button" id="morphBtn" class="rose-btn small-pill">Bas!</button>

      <button type="button" id="shareBtn" class="rose-btn">Bólisiw</button>
    </div>
  </section>

  <script>
    (function () {

      /* ===================== DOM REFS ===================== */
      const el = {
        toast: document.getElementById('toast'),

      /* ===================== TOAST ===================== */
      let toastTimer = null;
      function showToast(msg) {
        el.toast.textContent = msg;
        el.toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          el.toast.classList.remove('show');
        }, 2600);
      }

      /* ===================== STAGE NAVIGATION ===================== */
      let currentStage = 1;
      let envelopeTimeout = null;
      let isEnvelopeOpening = false;

      function setStage(stageNum) {
        currentStage = stageNum;
        clearTimeout(envelopeTimeout);

        el.stage1.classList.toggle('active', stageNum === 1);
        el.stage2.classList.toggle('active', stageNum === 2);
        el.stage3.classList.toggle('active', stageNum === 3);
        el.cosmosStage.classList.toggle('active', stageNum === 4 || stageNum === 5);

        if (stageNum === 2) {
          isEnvelopeOpening = false;
          el.envelopeWrap.classList.remove('opening');
          el.envelopePrompt.textContent = 'bunı ash';
          el.envelopeScene.classList.remove('visible');
          el.introTextWrap.classList.add('visible');

          envelopeTimeout = setTimeout(function () {
            el.introTextWrap.classList.remove('visible');
            setTimeout(function () {
              el.envelopeScene.classList.add('visible');
            }, 350);
          }, 1350);
        }

        if (stageNum === 4) {
          enterCosmosMode('galaxy');
        } else if (stageNum === 5) {
          enterCosmosMode('portrait');
        } else {
          stopCosmosLoop();
        }
      }

      /* ===================== STAGE 1 HANDLERS ===================== */
      function handleUnlock() {
        const val = (el.secretInput.value || '').trim().toLowerCase();
        if (val === SECRET_WORD) {
          el.lockError.classList.remove('show');
          el.unlockBtn.textContent = 'tekserilmekte...';
          el.unlockBtn.disabled = true;
          setTimeout(function () {
            setStage(2);
          }, 680);
        } else {
          el.lockError.textContent = 'Qáte sóz. Jáne bir márte urınıp kór 🤍';
          el.lockError.classList.add('show');
          el.secretInput.classList.remove('shake');
          void el.secretInput.offsetWidth;
          el.secretInput.classList.add('shake');
        }
      }

      el.unlockBtn.addEventListener('click', handleUnlock);
      el.secretInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') handleUnlock();
      });

      /* ===================== STAGE 2 HANDLERS ===================== */
      function openEnvelope() {
        if (isEnvelopeOpening) return;
        isEnvelopeOpening = true;
        el.envelopePrompt.textContent = 'ashılmaqta...';
        el.envelopeWrap.classList.add('opening');
        setTimeout(function () {
          setStage(3);
        }, 1050);
      }

      el.envelopeWrap.addEventListener('click', openEnvelope);
      el.envelopeWrap.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openEnvelope();
        }
      });

      /* ===================== STAGE 3 HANDLERS ===================== */
      el.toGalaxyBtn.addEventListener('click', function () {
        setStage(4);
      });

      /* ===================== STAGE 4 & 5: 3D GALAXY + ULTRA-CRISP PORTRAIT ENGINE ===================== */
      const ctx = el.cosmosCanvas.getContext('2d');
      let animId = null;
      let canvasW = 0;
      let canvasH = 0;
      let dpr = 1;

      let cosmosMode = 'galaxy';
      let modeTime = 0;
      let lastTs = 0;

      let rotY = 0;
      let rotX = 0.96;
      let targetRotX = 0.96;
      let targetZoom = 1.0;
      let zoom = 1.0;
      let velY = 0.004;
      let isDragging = false;
      let lastPtrX = 0;
      let lastPtrY = 0;

      let introParticles = [];
      let bgStars = [];
      let galaxyNodes = [];

      // High-resolution pre-rendered portrait canvas for crystal-clear facial detail
      let loadedPhoto = null;
      let portraitLayer = null;
      let portraitLayerW = 0;
      let portraitLayerH = 0;

      function buildBgStars() {
        bgStars = [];
        for (let i = 0; i < 110; i++) {
          bgStars.push({
            x: Math.random(),
            y: Math.random(),
            r: Math.random() * 1.3 + 0.3,
            a: Math.random() * 0.45 + 0.15,
            phase: Math.random() * Math.PI * 2
          });
        }
      }

      function buildGalaxyNodes() {
        galaxyNodes = [];
        const arms = 3;
        const count = 340;
        for (let i = 0; i < count; i++) {
          const t = Math.pow(Math.random(), 0.72);
          const radius = 12 + t * 235;
          const armIndex = i % arms;
          const armAngle = (armIndex / arms) * Math.PI * 2;
          const spin = radius * 0.025;
          const scatter = (Math.random() - 0.5) * (0.42 + t * 0.45);
          const angle = armAngle + spin + scatter;
          const ySpread = (Math.random() - 0.5) * (16 + (1 - t) * 26);

          galaxyNodes.push({
            baseAngle: angle,
            radius: radius,
            y: ySpread,
            phrase: LOVE_PHRASES[i % LOVE_PHRASES.length],
            size: 8.5 + (1 - t) * 4.5 + Math.random() * 2.5,
            hueMix: Math.random(),
            speed: 0.14 + (1 - t) * 0.16
          });
        }
      }

      function buildIntroHearts() {
        introParticles = [];
        for (let i = 0; i < 22; i++) {
          introParticles.push({
            x: 0.15 + Math.random() * 0.7,
            y: 0.25 + Math.random() * 0.55,
            vy: -(0.06 + Math.random() * 0.08),
            vx: (Math.random() - 0.5) * 0.03,
            type: Math.random() > 0.42 ? 'heart' : 'sparkle',
            size: 14 + Math.random() * 14,
            alpha: 0.9 + Math.random() * 0.1
          });
        }
      }

      /* Build ultra-crisp, high-DPI composite portrait:
         1) Subtle soft rose-tinted photo glow underneath so every facial contour is crystal clear
         2) 118 dense horizontal lines of glowing Karakalpak micro-typography modulated directly by photo pixels
         3) Smooth elliptical feather mask so portrait melts organically into the dark cosmos */
      function buildCrispPortraitLayer() {
        if (!loadedPhoto || canvasW === 0 || canvasH === 0) return;

        const targetH = Math.min(canvasH * 0.60, 490);
        const imgAspect = loadedPhoto.width / loadedPhoto.height;
        const targetW = Math.min(canvasW * 0.92, targetH * imgAspect);
        const finalH = targetW / imgAspect;

        portraitLayerW = Math.round(targetW);
        portraitLayerH = Math.round(finalH);

        const off = document.createElement('canvas');
        off.width = Math.round(portraitLayerW * dpr);
        off.height = Math.round(portraitLayerH * dpr);
        const octx = off.getContext('2d');
        octx.setTransform(dpr, 0, 0, dpr, 0, 0);

        // 1. Sample photo pixels at high resolution for the micro-text grid
        const ROWS = 114;
        const COLS = 128;
        const sampleCanvas = document.createElement('canvas');
        sampleCanvas.width = COLS;
        sampleCanvas.height = ROWS;
        const sctx = sampleCanvas.getContext('2d');
        sctx.drawImage(loadedPhoto, 0, 0, COLS, ROWS);
        const pixels = sctx.getImageData(0, 0, COLS, ROWS).data;

        // 2. Draw a soft, luminous photo underlay (gives crystal clarity to eyes, smile & roses)
        octx.save();
        octx.filter = 'contrast(1.12) brightness(0.96) saturate(0.68)';
        octx.globalAlpha = 0.52;
        octx.drawImage(loadedPhoto, 0, 0, portraitLayerW, portraitLayerH);
        octx.restore();

        // Warm romantic rose tint over the underlay
        octx.save();
        octx.globalCompositeOperation = 'color';
        octx.fillStyle = 'rgba(255, 195, 218, 0.28)';
        octx.fillRect(0, 0, portraitLayerW, portraitLayerH);
        octx.restore();

        // 3. Overlay razor-sharp horizontal micro-text lines driven by exact pixel luminance & warmth
        const words = [
          'Gulim',
          'Men seni shın júregim menen jaqsı kóremen',
          'Men seni súyemen',
          'Janım Gulim'
        ];
        const rowH = portraitLayerH / ROWS;
        const colW = portraitLayerW / COLS;
        const fontSize = Math.max(4.4, Math.min(6.4, rowH * 1.06));

        octx.font = '600 ' + fontSize.toFixed(1) + 'px Inter, monospace';
        octx.textAlign = 'left';
        octx.textBaseline = 'middle';

        for (let r = 0; r < ROWS; r++) {
          let line = '';
          let idx = r;
          while (line.length < COLS + 20) {
            line += words[idx % words.length] + ' · ';
            idx += 1;
          }
          const y = (r + 0.5) * rowH;

          for (let c = 0; c < COLS; c++) {
            const pIdx = (r * COLS + c) * 4;
            const cr = pixels[pIdx];
            const cg = pixels[pIdx + 1];
            const cb = pixels[pIdx + 2];
            const lum = (0.299 * cr + 0.587 * cg + 0.114 * cb) / 255;

            if (lum < 0.08) continue;

            // Blend real photo color slightly toward glowing rose-white so text stays luminous & crisp
            const tr = Math.min(255, Math.round(cr * 0.55 + 255 * 0.45));
            const tg = Math.min(255, Math.round(cg * 0.55 + 225 * 0.45));
            const tb = Math.min(255, Math.round(cb * 0.55 + 238 * 0.45));
            const alpha = Math.min(0.95, Math.pow(lum, 0.85) * 0.92);

            octx.fillStyle = 'rgba(' + tr + ',' + tg + ',' + tb + ',' + alpha.toFixed(2) + ')';
            octx.fillText(line.charAt(c), c * colW, y);
          }
        }

        // 4. Feather edges smoothly into transparency with an elliptical radial mask
        octx.save();
        octx.globalCompositeOperation = 'destination-in';
        const cx = portraitLayerW * 0.5;
        const cy = portraitLayerH * 0.48;
        const rx = portraitLayerW * 0.52;
        const ry = portraitLayerH * 0.52;
        octx.translate(cx, cy);
        octx.scale(1, ry / rx);
        const maskGrad = octx.createRadialGradient(0, 0, rx * 0.52, 0, 0, rx);
        maskGrad.addColorStop(0, 'rgba(0,0,0,1)');
        maskGrad.addColorStop(0.72, 'rgba(0,0,0,0.92)');
        maskGrad.addColorStop(1, 'rgba(0,0,0,0)');
        octx.fillStyle = maskGrad;
        octx.beginPath();
        octx.arc(0, 0, rx, 0, Math.PI * 2);
        octx.fill();
        octx.restore();

        portraitLayer = off;
      }

      function preloadPhoto() {
        const img = new Image();
        img.onload = function () {
          loadedPhoto = img;
          buildCrispPortraitLayer();
        };
        img.src = PHOTO_SRC;
      }

      function resizeCosmosCanvas() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvasW = window.innerWidth;
        canvasH = window.innerHeight;
        el.cosmosCanvas.width = Math.floor(canvasW * dpr);
        el.cosmosCanvas.height = Math.floor(canvasH * dpr);
        el.cosmosCanvas.style.width = canvasW + 'px';
        el.cosmosCanvas.style.height = canvasH + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (loadedPhoto) buildCrispPortraitLayer();
      }

      function enterCosmosMode(targetMode) {
        resizeCosmosCanvas();
        if (galaxyNodes.length === 0) buildGalaxyNodes();
        if (bgStars.length === 0) buildBgStars();
        if (loadedPhoto && !portraitLayer) buildCrispPortraitLayer();

        modeTime = 0;
        lastTs = performance.now();

        if (targetMode === 'galaxy') {
          cosmosMode = 'introHearts';
          buildIntroHearts();
          rotY = 0;
          rotX = 0.96;
          targetRotX = 0.96;
          zoom = 0.88;
          targetZoom = 1.0;
          velY = 0.0045;

          el.galaxyHint.classList.remove('hidden');
          el.morphBtn.classList.remove('hidden');
          el.portraitCaptionWrap.classList.remove('visible');
        } else {
          cosmosMode = 'portrait';
          el.galaxyHint.classList.add('hidden');
          el.morphBtn.classList.add('hidden');
          el.portraitCaptionWrap.classList.add('visible');
        }

        startCosmosLoop();
      }

      function triggerMorphToPortrait() {
        if (cosmosMode === 'morphing' || cosmosMode === 'portrait') return;
        cosmosMode = 'morphing';
        modeTime = 0;
        currentStage = 5;
        el.galaxyHint.classList.add('hidden');
        el.morphBtn.classList.add('hidden');
      }

      function startCosmosLoop() {
        stopCosmosLoop();
        lastTs = performance.now();
        animId = requestAnimationFrame(renderCosmos);
      }

      function stopCosmosLoop() {
        if (animId !== null) {
          cancelAnimationFrame(animId);
          animId = null;
        }
      }

      function drawBgStars(ts) {
        for (let i = 0; i < bgStars.length; i++) {
          const s = bgStars[i];
          const twinkle = 0.55 + 0.45 * Math.sin(ts * 0.0018 + s.phase);
          ctx.fillStyle = 'rgba(255, 224, 238, ' + (s.a * twinkle).toFixed(3) + ')';
          ctx.beginPath();
          ctx.arc(s.x * canvasW, s.y * canvasH, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawGalaxy(ts, dt, fadeAlpha, edgeTiltOverride) {
        const cx = canvasW * 0.5;
        const cy = canvasH * 0.44;
        const baseScale = Math.min(canvasW, canvasH) / 480;
        const curZoom = zoom * baseScale;

        const coreGrad = ctx.createRadialGradient(cx, cy, 2, cx, cy, 130 * curZoom);
        coreGrad.addColorStop(0, 'rgba(255, 245, 250, ' + (0.92 * fadeAlpha) + ')');
        coreGrad.addColorStop(0.22, 'rgba(255, 175, 208, ' + (0.48 * fadeAlpha) + ')');
        coreGrad.addColorStop(0.55, 'rgba(220, 95, 145, ' + (0.14 * fadeAlpha) + ')');
        coreGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = coreGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, 130 * curZoom, 0, Math.PI * 2);
        ctx.fill();

        const useRotX = edgeTiltOverride !== null ? edgeTiltOverride : rotX;
        const cosY = Math.cos(rotY);
        const sinY = Math.sin(rotY);
        const cosX = Math.cos(useRotX);
        const sinX = Math.sin(useRotX);

        const projected = [];
        for (let i = 0; i < galaxyNodes.length; i++) {
          const n = galaxyNodes[i];
          const a = n.baseAngle + ts * 0.00018 * n.speed;
          const x0 = Math.cos(a) * n.radius;
          const z0 = Math.sin(a) * n.radius;
          const y0 = n.y;

          const x1 = x0 * cosY - z0 * sinY;
          const z1 = x0 * sinY + z0 * cosY;
          const y2 = y0 * cosX - z1 * sinX;
          const z2 = y0 * sinX + z1 * cosX;

          const fov = 520;
          const persp = fov / (fov + z2 + 240);
          if (persp <= 0.05) continue;

          projected.push({
            sx: cx + x1 * persp * curZoom * 1.15,
            sy: cy + y2 * persp * curZoom * 1.15,
            z: z2,
            persp: persp,
            node: n
          });
        }

        projected.sort(function (a, b) { return b.z - a.z; });

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        for (let i = 0; i < projected.length; i++) {
          const p = projected[i];
          const n = p.node;
          const depthAlpha = Math.max(0.12, Math.min(1, (p.persp - 0.35) * 1.5));
          const alpha = depthAlpha * fadeAlpha;
          const fontSize = Math.max(5.5, n.size * p.persp * curZoom * 0.85);

          if (n.radius < 65) {
            ctx.fillStyle = 'rgba(255, 246, 250, ' + alpha.toFixed(3) + ')';
          } else if (n.hueMix > 0.45) {
            ctx.fillStyle = 'rgba(255, 198, 220, ' + (alpha * 0.92).toFixed(3) + ')';
          } else {
            ctx.fillStyle = 'rgba(248, 152, 190, ' + (alpha * 0.82).toFixed(3) + ')';
          }

          ctx.font = '500 ' + fontSize.toFixed(1) + 'px Inter, sans-serif';
          ctx.fillText(n.phrase, p.sx, p.sy);
        }
      }

      function drawCrispPortrait(ts, revealT) {
        if (!portraitLayer) return;

        const startX = (canvasW - portraitLayerW) * 0.5;
        const startY = Math.max(32, (canvasH * 0.40) - portraitLayerH * 0.5);

        // Soft pink halo behind portrait
        const pg = ctx.createRadialGradient(
          canvasW * 0.5, startY + portraitLayerH * 0.5, 10,
          canvasW * 0.5, startY + portraitLayerH * 0.5, portraitLayerW * 0.68
        );
        pg.addColorStop(0, 'rgba(255, 132, 178, ' + (0.16 * revealT) + ')');
        pg.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = pg;
        ctx.fillRect(0, 0, canvasW, canvasH);

        if (revealT >= 0.995) {
          ctx.drawImage(portraitLayer, startX, startY, portraitLayerW, portraitLayerH);
          return;
        }

        // Dramatic horizontal strip assembly during morph-in
        const slices = 44;
        const srcSliceH = portraitLayer.height / slices;
        const dstSliceH = portraitLayerH / slices;
        const scatter = Math.pow(1 - revealT, 2.2);

        ctx.save();
        ctx.globalAlpha = revealT;
        for (let i = 0; i < slices; i++) {
          const offsetX = scatter * Math.sin(i * 1.45 + ts * 0.009) * portraitLayerW * 0.46;
          ctx.drawImage(
            portraitLayer,
            0, i * srcSliceH, portraitLayer.width, srcSliceH,
            startX + offsetX, startY + i * dstSliceH, portraitLayerW, dstSliceH + 0.5
          );
        }
        ctx.restore();
      }

      function renderCosmos(ts) {
        const dt = Math.min(0.05, (ts - lastTs) / 1000);
        lastTs = ts;
        modeTime += dt;

        ctx.clearRect(0, 0, canvasW, canvasH);
        drawBgStars(ts);

        if (cosmosMode === 'introHearts') {
          const gFade = Math.max(0, Math.min(1, (modeTime - 0.35) / 0.85));
          if (gFade > 0) {
            rotY += 0.006;
            drawGalaxy(ts, dt, gFade, null);
          }

          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          for (let i = 0; i < introParticles.length; i++) {
            const p = introParticles[i];
            p.y += p.vy * dt;
            p.x += p.vx * dt;
            const a = Math.max(0, 1 - modeTime / 1.25) * p.alpha;
            if (a <= 0.01) continue;
            ctx.globalAlpha = a;
            ctx.font = p.size + 'px Inter, sans-serif';
            ctx.fillText(p.type === 'heart' ? '🤍' : '✨', p.x * canvasW, p.y * canvasH);
          }
          ctx.globalAlpha = 1;

          if (modeTime >= 1.25) {
            cosmosMode = 'galaxy';
            modeTime = 0;
          }
        } else if (cosmosMode === 'galaxy') {
          if (!isDragging) {
            rotY += velY;
            velY = velY * 0.96 + 0.0042 * 0.04;
          }
          rotX += (targetRotX - rotX) * 0.1;
          zoom += (targetZoom - zoom) * 0.1;

          drawGalaxy(ts, dt, 1, null);
        } else if (cosmosMode === 'morphing') {
          const t = Math.min(1, modeTime / 2.1);

          if (t < 0.44) {
            const p1 = t / 0.44;
            rotY += 0.02 + p1 * 0.09;
            const tilt = rotX + (Math.PI * 0.49 - rotX) * p1;
            drawGalaxy(ts, dt, 1 - p1 * 0.4, tilt);
          } else {
            const p2 = (t - 0.44) / 0.56;
            const eased = 1 - Math.pow(1 - p2, 3);
            if (p2 < 0.35) {
              drawGalaxy(ts, dt, (1 - p2 / 0.35) * 0.6, Math.PI * 0.49);
            }
            drawCrispPortrait(ts, eased);
          }

          if (t >= 1) {
            cosmosMode = 'portrait';
            modeTime = 0;
            el.portraitCaptionWrap.classList.add('visible');
          }
        } else if (cosmosMode === 'portrait') {
          drawCrispPortrait(ts, 1);
        }

        animId = requestAnimationFrame(renderCosmos);
      }

      /* ===================== POINTER / TOUCH INTERACTION FOR GALAXY ===================== */
      el.cosmosCanvas.addEventListener('pointerdown', function (e) {
        if (cosmosMode !== 'galaxy') return;
        isDragging = true;
        lastPtrX = e.clientX;
        lastPtrY = e.clientY;
        el.cosmosCanvas.setPointerCapture(e.pointerId);
      });

      el.cosmosCanvas.addEventListener('pointermove', function (e) {
        if (!isDragging || cosmosMode !== 'galaxy') return;
        const dx = e.clientX - lastPtrX;
        const dy = e.clientY - lastPtrY;
        lastPtrX = e.clientX;
        lastPtrY = e.clientY;
        rotY += dx * 0.008;
        velY = dx * 0.004;
        targetRotX = Math.max(-1.45, Math.min(1.45, targetRotX + dy * 0.007));
      });

      function endDrag() {
        isDragging = false;
      }
      el.cosmosCanvas.addEventListener('pointerup', endDrag);
      el.cosmosCanvas.addEventListener('pointercancel', endDrag);

      el.cosmosCanvas.addEventListener('wheel', function (e) {
        if (cosmosMode !== 'galaxy') return;
        e.preventDefault();
        targetZoom = Math.max(0.65, Math.min(2.6, targetZoom - e.deltaY * 0.0014));
      }, { passive: false });

      window.addEventListener('resize', function () {
        if (currentStage === 4 || currentStage === 5) {
          resizeCosmosCanvas();
        }
      });

      /* ===================== BUTTONS ===================== */
      el.morphBtn.addEventListener('click', triggerMorphToPortrait);

      el.shareBtn.addEventListener('click', function () {
        const shareUrl = window.location.href;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(shareUrl).then(function () {
            showToast('Silteme kóshirildi 🤍');
          }).catch(function () {
            fallbackCopy(shareUrl);
          });
        } else {
          fallbackCopy(shareUrl);
        }
      });

      function fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
        } catch (err) {
          // ignore
        }
        document.body.removeChild(ta);
        showToast('Silteme kóshirildi 🤍');
      }

      /* ===================== INIT ===================== */
      buildBgStars();
      buildGalaxyNodes();
      preloadPhoto();
      setStage(1);
    })();
  </script>
</body>
